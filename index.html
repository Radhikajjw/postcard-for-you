<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A Postcard for You</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #f4f1ea 0%, #e2dcd0 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      overflow: hidden;
    }

    /* 3D Scene Container */
    .scene {
      width: 100%;
      max-width: 600px; /* Maximum width on desktop */
      perspective: 1400px;
      cursor: pointer;
    }

    /* The Flipping Card */
    .card {
      width: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18), 0 4px 12px rgba(0, 0, 0, 0.1);
    }

    .card.is-flipped {
      transform: rotateY(-180deg);
    }

    /* Front and Back Faces */
    .card-face {
      width: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }

    /* Front sets the natural height of the card based on your image */
    .card-front {
      position: relative;
      z-index: 2;
    }

    /* Back overlays the front and starts rotated 180 degrees */
    .card-back {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      transform: rotateY(180deg);
    }

    .card-face img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Subtle Tap Hint */
    .hint {
      margin-top: 24px;
      font-size: 14px;
      letter-spacing: 0.04em;
      color: #6b6459;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.85;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="scene" id="postcardScene">
    <div class="card" id="postcard">
      <!-- FRONT IMAGE -->
      <div class="card-face card-front">
        <img src="front.png" alt="Postcard Front" />
      </div>

      <!-- BACK IMAGE -->
      <div class="card-face card-back">
        <img src="back.png" alt="Postcard Back" />
      </div>
    </div>
  </div>

  <p class="hint" id="hintText">Tap the postcard to flip</p>

  <script>
    const scene = document.getElementById('postcardScene');
    const card = document.getElementById('postcard');
    const hint = document.getElementById('hintText');

    scene.addEventListener('click', () => {
      card.classList.toggle('is-flipped');
      hint.textContent = card.classList.contains('is-flipped')
        ? 'Tap the postcard to flip'
        : 'Tap the postcard to flip';
    });
  </script>

</body>
</html>
